version: 2.1


# Java Gradle CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-java/ for more details
#
executors:
    java-executor: # linux executor using the node base image
        docker:
            -   image: cimg/openjdk:14.0.2

jobs:
    checkout:
        executor: java-executor
        steps:
            - checkout
            -   restore_cache:
                    keys:
                        - gradle-{{ .Branch }}-{{ checksum "build.gradle" }}
                        - gradle-{{ .Branch }}-
                        - gradle-
            -   save_cache:
                    key: gradle-{{ .Branch }}-{{ checksum "build.gradle" }}
                    paths:
                        - ~/.gradle/caches
                        - ~/.gradle/wrapper
                        - ~/project/bin/main
                        - ~/project/bin/test
                        - ~/project/bin/testIntegration
            -   persist_to_workspace:
                    root: /tmp/workspace
                    paths:
                        - .
            -   run: ls
            -   run: ls
            -   run: pwd
    test:
        executor: java-executor
        parameters:
            service-name:
                type: string

        steps:
            -   attach_workspace:
                    at: /tmp/workspace
            -   run: ls
            -   run: ls /tmp/workspace
            -   run: pwd
            #            -   run: ls /home/circleci/project
            -   run: ./gradlew  :services:<<parameters.service-name>>:test
    buildDocker:
        executor: java-executor
        environment:
            SME_BE_HOST: http://192.168.1.14
        parameters:
            service-name:
                type: string
        steps:
            -   run: ls
            -   run: pwd
            -   run: ./gradlew  -DSME_BE_HOST=${SME_BE_HOS} -DDOCKER_REGISTRY=${AWS_ECR_ACCOUNT_URL}  :services:<<parameters.service-name>>:buildDocker -x test -Dservice-name=segmentme-<<parameters.service-name>>

# the default pipeline parameters, which will be updated according to
# the results of the path-filtering orb
parameters:
    access-control-service-changed:
        type: boolean
        default: false
    measurement-service-changed:
        type: boolean
        default: false
    management-service-changed:
        type: boolean
        default: false
    analysis-service-changed:
        type: boolean
        default: false
    analysis-api-service-changed:
        type: boolean
        default: false
    channel-service-changed:
        type: boolean
        default: false

# here we specify our workflows, most of which are conditionally
# executed based upon pipeline parameter values. Each workflow calls a
# specific job defined above, in the jobs section.
workflows:
    # when pipeline parameter, access-control-service-changed is true, the
    # build-service-1 job is triggered.
    access-control-service:
        when: << pipeline.parameters.access-control-service-changed >>
        jobs:
            - checkout
            -   test:
                    service-name: access-control-service
                    requires:
                        - checkout
            -   buildDocker:
                    service-name: access-control-service
                    requires:
                        - test

