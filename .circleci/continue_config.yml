version: 2.1

orbs:
    aws-cli: circleci/aws-cli@2.0.3
    aws-ecs: circleci/aws-ecs@02.2.1

# Java Gradle CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-java/ for more details
#
executors:
    java-executor: # linux executor using the node base image
        docker:
            -   image: cimg/openjdk:14.0.2

jobs:
    checkout:
        executor: java-executor
        steps:
            - checkout
            -   restore_cache:
                    keys:
                        - gradle-{{ .Branch }}-{{ checksum "build.gradle" }}
                        - gradle-{{ .Branch }}-
                        - gradle-
            -   save_cache:
                    key: gradle-{{ .Branch }}-{{ checksum "build.gradle" }}
                    paths:
                        - ~/.gradle/caches
                        - ~/.gradle/wrapper
                        - ~/project/bin/main
                        - ~/project/bin/test
            -   persist_to_workspace:
                    root: .
                    paths:
                        - ./*
    test:
        executor: java-executor
        parameters:
            service-name:
                type: string

        steps:
            -   attach_workspace:
                    at: .
            #            -   run: ls /home/circleci/project
            -   run: ./gradlew  :services:<<parameters.service-name>>:test
    buildDocker:
        executor: java-executor
        environment:
            SME_BE_HOST: http://192.168.1.14
        parameters:
            service-name:
                type: string
        steps:
            -   attach_workspace:
                    at: .
            -   setup_remote_docker:
                    docker_layer_caching: false
            -   run:
                    name: Build docker image
                    command: ./gradlew  -DSME_BE_HOST=${SME_BE_HOS} -DDOCKER_REGISTRY=${AWS_ECR_ACCOUNT_URL}  :services:<<parameters.service-name>>:buildDocker -x test -Dservice-name=segmentme-<<parameters.service-name>>
            -   run: docker images
            -   run:
                    name: Save image to an archive
                    command: |
                        mkdir docker-image
                        docker save -o docker-image/image.tar ${AWS_ECR_ACCOUNT_URL}/segmentme-<<parameters.service-name>>:latest
            -   persist_to_workspace:
                    root: .
                    paths:
                        - docker-image
    deploy:
        executor: java-executor
        parameters:
            service-name:
                type: string
        environment:
            AWS_DEFAULT_OUTPUT: json
        steps:
            - setup_remote_docker
            -   attach_workspace:
                    at: workspace
            - aws-cli/install
            -   run:
                    name: Load image
                    command: |
                        docker load --input workspace/docker-image/image.tar
            -   run:
                    name: Push image
                    command: |
                        eval $(aws ecr  get-login-password --region us-east-1 | docker login --username AWS --password-stdin $AWS_ECR_ACCOUNT_URL)
                        docker push ${AWS_ECR_ACCOUNT_URL}/segmentme-<<parameters.service-name>>:latest
#            -   aws-ecs/update-service:
#                    family: "${ECS_SERVICE_NAME}"
#                    cluster-name: "${ECS_CLUSTER_NAME}"
#                    container-image-name-updates: "container=${ECS_SERVICE_NAME},image-and-tag=${FULL_IMAGE_NAME}"
