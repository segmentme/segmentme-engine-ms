dependencies {
    api project(":dependencies:models:shared")
    api 'org.apache.commons:commons-lang3'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    api 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.data:spring-data-commons'

    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.security:spring-security-oauth2-resource-server'
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    implementation 'org.springframework.security:spring-security-config'
    api 'org.springframework.security:spring-security-oauth2-client'

    api group: 'javax.servlet', name: 'javax.servlet-api', version: '4.0.1'

    api group: 'org.springframework.security.oauth', name: 'spring-security-oauth2', version: '2.5.0.RELEASE'
    implementation group: 'javax.validation', name: 'validation-api', version: '2.0.1.Final'

}

task jarTests(type: Jar, dependsOn: testClasses) {
    archiveClassifier = 'tests'
    from sourceSets.test.output
}
configurations {
    tests {
        extendsFrom testImplementation
    }
}

artifacts {
    tests jarTests
}