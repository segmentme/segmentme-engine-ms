logging:
  level:
    root: INFO
auth0:
  audience: https://segmentme.us.auth0.com/api/v2/
  managementApi: https://segmentme.us.auth0.com/api/v2/
spring:
    data:
        mongodb:
            auto-index-creation: on
    security:
        oauth2:
            client:
                registration:
                    auth0:
                        client-id: ${AUTH0_CLIENT_ID:FRFEhM5zwQCva2tSfBxDuM3og5TdjUpC}
                        client-secret: ${AUTH0_CLIENT_SECRET:Rsic0pW4Wr_q91Ppin-UNRuq5EdH5X7EmhA4ZUTcN-6MBu_Wy8Ce1J89WPCpkD_4}
                        authorization-grant-type: client_credentials
                        clientAuthenticationMethod: post
                provider:
                    auth0:
                        token-uri: https://segmentme.us.auth0.com/oauth/token
            resourceserver:
                jwt:
                    issuer-uri: https://segmentme.us.auth0.com/
segmentme:
  application:
    web-client:
      configuration:
        access-control-service:
          connection:
            connectTimeOut: 20000  #milisecond
            readTimeOut: 10000  #milisecond
            writeTimeOut: 10000 #milisecond
          host: ${ACCESS_SERVICE_HOST:http://localhost:8085}
          service-name: access-control-service
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connectionTimeout: ${REDIS_CONNECTION_TIMEOUT:25}
      readTimeOut: ${REDIS_READ_TIMEOUT:15}
server:
  port: 8084
  servlet:
    context-path: /management-service