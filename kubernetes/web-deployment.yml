apiVersion: apps/v1
kind: Deployment
metadata:
    name: web-app
    labels:
        app.kubernetes.io/name: web-app
spec:
    selector:
        matchLabels:
            app: web-app
    replicas: 1
    template:
        metadata:
            labels:
                app: web-app
        spec:
            containers:
                -   name: web-app
                    image: $IMAGE_NAME
                    imagePullPolicy: Always
                    resources:
                        limits:
                            memory: 512Mi
                        requests:
                            memory: 512Mi
                    ports:
                        -   containerPort: 80
                    livenessProbe:
                        httpGet:
                            path: /
                            port: 80
                        initialDelaySeconds: 60
                        timeoutSeconds: 5
                        periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
    name: web-app
spec:
    selector:
        app: web-app
    ports:
        -   name: http
            protocol: TCP
            port: 80
            targetPort: 80
    type: NodePort

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
    name: web-app
spec:
    selector:
        matchLabels:
            app: web-app
    maxUnavailable: 30%

---
apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
    name: web-app
spec:
    scaleTargetRef:
        apiVersion: extensions/v1beta1
        kind: Deployment
        name: web-app
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
                        
                        