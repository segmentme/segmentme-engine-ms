apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  selector:
    matchLabels:
      app: web
  replicas: 1
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        -   name: web
            image: $DOCKER_REGISTRY/segmentme-web
            imagePullPolicy: Always
            resources:
              limits:
                memory: 512Mi
              requests:
                memory: 512Mi
            ports:
              -   containerPort: 80
            livenessProbe:
              httpGet:
                path: /
                port: 80
              initialDelaySeconds: 60
              timeoutSeconds: 5
              periodSeconds: 20